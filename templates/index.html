<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack 영단어 퀴즈</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f4f8; color: #2d3748; }

    header {
      background: #4a154b;
      color: #fff;
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header .date { font-size: 0.9rem; opacity: .75; }

    .container { max-width: 760px; margin: 40px auto; padding: 0 16px; }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-card {
      flex: 1;
      background: #fff;
      border-radius: 10px;
      padding: 16px 20px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    .stat-card .num { font-size: 2rem; font-weight: 700; color: #4a154b; }
    .stat-card .label { font-size: 0.8rem; color: #718096; margin-top: 4px; }

    .btn-quiz {
      display: block;
      width: 100%;
      padding: 16px;
      background: #4a154b;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      margin-bottom: 28px;
      transition: background .15s;
    }
    .btn-quiz:hover { background: #611f69; }

    .word-list {
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
      overflow: hidden;
    }
    .word-list h2 {
      padding: 16px 20px;
      font-size: 1rem;
      color: #4a154b;
      border-bottom: 1px solid #e2e8f0;
    }
    .word-row {
      display: flex;
      align-items: baseline;
      padding: 12px 20px;
      border-bottom: 1px solid #f0f4f8;
      gap: 16px;
    }
    .word-row:last-child { border-bottom: none; }
    .word-num { width: 24px; color: #a0aec0; font-size: 0.85rem; flex-shrink: 0; }
    .word-en { width: 180px; font-weight: 600; color: #2d3748; flex-shrink: 0; }
    .word-ko { color: #718096; font-size: 0.9rem; }
  </style>
</head>
<body>

<header>
  <h1>Slack 영단어 퀴즈</h1>
  <span class="date">{{ today }}</span>
</header>

<div class="container">
  <div class="stats">
    <div class="stat-card">
      <div class="num">{{ total }}</div>
      <div class="label">전체 단어</div>
    </div>
    <div class="stat-card">
      <div class="num">{{ base_count }}</div>
      <div class="label">기본 단어</div>
    </div>
    <div class="stat-card">
      <div class="num">{{ slack_count }}</div>
      <div class="label">Slack 수집 단어</div>
    </div>
  </div>

  <a href="/quiz" class="btn-quiz">오늘의 퀴즈 시작 →</a>

  <div class="word-list">
    <h2>오늘의 단어 {{ daily_words|length }}개</h2>
    {% for entry in daily_words %}
    <div class="word-row">
      <span class="word-num">{{ loop.index }}</span>
      <span class="word-en">{{ entry.word }}</span>
      <span class="word-ko">{{ entry.meaning }}</span>
    </div>
    {% endfor %}
  </div>
</div>

</body>
</html>
